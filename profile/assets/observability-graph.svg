<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="obs-title obs-desc">
  <title id="obs-title">TrustEdge observability graph</title>
  <desc id="obs-desc">Twin graph: a device links to processes, AI tools, and network flows. Rules match or correlate activity and raise alerts for impact analysis, blast radius, and root-cause analysis.</desc>
  <defs>
    <linearGradient id="obs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <marker id="obs-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <filter id="obs-soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; fill: #64748B; }
      .lead { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; }
      .s { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 600; fill: #64748B; }
      .n { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 15px; font-weight: 800; fill: #0F172A; }
      .rel { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 11px; font-weight: 700; fill: #64748B; }
      .cap { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; fill: #94A3B8; }
      .pill { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 12px; font-weight: 700; }
      .num { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1180" height="500" rx="20" fill="url(#obs-bg)"/>
  <text class="title" x="36" y="30">OBSERVABILITY GRAPH</text>
  <text class="lead" x="236" y="30">Twin model for impact · blast radius · RCA</text>

  <text class="cap" x="155" y="62" text-anchor="middle">1 · OBSERVED</text>
  <text class="cap" x="430" y="62" text-anchor="middle">2 · ACTIVITY</text>
  <text class="cap" x="740" y="62" text-anchor="middle">3 · DETECTION</text>
  <text class="cap" x="1020" y="62" text-anchor="middle">4 · OUTCOME</text>

  <!--
    Card geometry (for edge routing):
      device  x=70..240   y=180..280  midY=230
      process x=320..540  y=80..170   midY=125
      ai tool x=320..540  y=185..275  midY=230
      flow    x=320..540  y=290..380  midY=335
      rule    x=620..860  y=180..280  midY=230
      alert   x=920..1120 y=180..280  midY=230
  -->
  <g fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#obs-arr)">
    <!-- device → process (hosts) -->
    <path d="M240 210 C275 210 290 125 318 125"/>
    <!-- device → ai tool (runs) -->
    <path d="M240 230 H318"/>
    <!-- device → flow (opens) -->
    <path d="M240 250 C275 250 290 335 318 335"/>
    <!-- process → rule (signals) -->
    <path d="M540 125 C575 125 590 200 618 210" stroke-dasharray="5 5"/>
    <!-- ai tool → rule (matches) -->
    <path d="M540 230 H618"/>
    <!-- flow → rule (correlates) -->
    <path d="M540 335 C575 335 590 260 618 250" stroke-dasharray="5 5"/>
    <!-- rule → alert (raises) -->
    <path d="M860 230 H918"/>
  </g>

  <text class="rel" x="265" y="148" text-anchor="middle">hosts</text>
  <text class="rel" x="275" y="220" text-anchor="middle">runs</text>
  <text class="rel" x="265" y="310" text-anchor="middle">opens</text>
  <text class="rel" x="575" y="158" text-anchor="middle">signals</text>
  <text class="rel" x="575" y="218" text-anchor="middle">matches</text>
  <text class="rel" x="575" y="318" text-anchor="middle">correlates</text>
  <text class="rel" x="885" y="218" text-anchor="middle">raises</text>

  <!-- Device -->
  <g transform="translate(70,180)" filter="url(#obs-soft)">
    <rect width="170" height="100" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect width="170" height="4" rx="2" fill="#2563EB"/>
    <circle cx="24" cy="28" r="10" fill="#2563EB"/>
    <text class="num" x="24" y="32" text-anchor="middle">1</text>
    <text class="n" x="85" y="52" text-anchor="middle">device</text>
    <text class="s" x="85" y="74" text-anchor="middle">endpoint / agent</text>
  </g>

  <!-- Process -->
  <g transform="translate(320,80)" filter="url(#obs-soft)">
    <rect width="220" height="90" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect width="220" height="4" rx="2" fill="#4F46E5"/>
    <text class="n" x="110" y="42" text-anchor="middle">process</text>
    <text class="s" x="110" y="64" text-anchor="middle">shell → curl</text>
  </g>

  <!-- AI tool -->
  <g transform="translate(320,185)" filter="url(#obs-soft)">
    <rect width="220" height="90" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <rect width="220" height="4" rx="2" fill="#0D9488"/>
    <text class="n" x="110" y="42" text-anchor="middle">ai tool</text>
    <text class="s" x="110" y="64" text-anchor="middle">cursor · ollama · cline</text>
  </g>

  <!-- Flow -->
  <g transform="translate(320,290)" filter="url(#obs-soft)">
    <rect width="220" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="220" height="4" rx="2" fill="#64748B"/>
    <text class="n" x="110" y="42" text-anchor="middle">flow</text>
    <text class="s" x="110" y="64" text-anchor="middle">tcp egress</text>
  </g>

  <!-- Rule -->
  <g transform="translate(620,180)" filter="url(#obs-soft)">
    <rect width="240" height="100" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <rect width="240" height="4" rx="2" fill="#D97706"/>
    <circle cx="24" cy="28" r="10" fill="#D97706"/>
    <text class="num" x="24" y="32" text-anchor="middle">3</text>
    <text class="n" x="120" y="52" text-anchor="middle">rule</text>
    <text class="s" x="120" y="74" text-anchor="middle">attack · behavior · novelty</text>
  </g>

  <!-- Alert -->
  <g transform="translate(920,180)" filter="url(#obs-soft)">
    <rect width="200" height="100" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="#E11D48"/>
    <circle cx="24" cy="28" r="10" fill="#E11D48"/>
    <text class="num" x="24" y="32" text-anchor="middle">4</text>
    <text class="n" x="100" y="52" text-anchor="middle">alert</text>
    <text class="s" x="100" y="74" text-anchor="middle">high severity</text>
  </g>

  <!-- Capability row -->
  <g transform="translate(70,420)">
    <rect width="220" height="42" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.4"/>
    <text class="pill" x="110" y="26" text-anchor="middle" fill="#1D4ED8">Impact analysis</text>
    <rect x="240" width="220" height="42" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.4"/>
    <text class="pill" x="350" y="26" text-anchor="middle" fill="#0F766E">Blast radius</text>
    <rect x="480" width="220" height="42" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.4"/>
    <text class="pill" x="590" y="26" text-anchor="middle" fill="#B45309">Root-cause (RCA)</text>
    <rect x="720" width="330" height="42" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.4"/>
    <text class="pill" x="885" y="26" text-anchor="middle" fill="#4338CA">GET /twin/graph/traverse</text>
  </g>
</svg>
